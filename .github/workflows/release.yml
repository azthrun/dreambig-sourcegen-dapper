name: Release

permissions:
  id-token: write
  contents: read

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve Package Version From Tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "Invalid release tag format: $TAG"
            echo "Expected format: vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved package version: $VERSION"

      - name: Restore
        run: dotnet restore DreamBig.SourceGen.Dapper.sln

      - name: Build
        run: dotnet build DreamBig.SourceGen.Dapper.sln --configuration Release --no-restore -p:Version="${{ env.PACKAGE_VERSION }}" -p:PackageVersion="${{ env.PACKAGE_VERSION }}"

      - name: Test
        run: dotnet test DreamBig.SourceGen.Dapper.sln --configuration Release --no-build -p:Version="${{ env.PACKAGE_VERSION }}" -p:PackageVersion="${{ env.PACKAGE_VERSION }}"

      - name: Pack
        run: |
          rm -f artifacts/nuget/*.nupkg artifacts/nuget/*.snupkg || true
          dotnet pack src/DreamBig.SourceGen.Dapper.SqlServer.Package/DreamBig.SourceGen.Dapper.SqlServer.Package.csproj --configuration Release --no-build -p:Version="${{ env.PACKAGE_VERSION }}" -p:PackageVersion="${{ env.PACKAGE_VERSION }}"
          dotnet pack src/DreamBig.SourceGen.Dapper.PostgreSql.Package/DreamBig.SourceGen.Dapper.PostgreSql.Package.csproj --configuration Release --no-build -p:Version="${{ env.PACKAGE_VERSION }}" -p:PackageVersion="${{ env.PACKAGE_VERSION }}"
          dotnet pack src/DreamBig.SourceGen.Dapper.Sqlite.Package/DreamBig.SourceGen.Dapper.Sqlite.Package.csproj --configuration Release --no-build -p:Version="${{ env.PACKAGE_VERSION }}" -p:PackageVersion="${{ env.PACKAGE_VERSION }}"
          test -f "artifacts/nuget/DreamBig.SourceGen.Dapper.SqlServer.${{ env.PACKAGE_VERSION }}.nupkg"
          test -f "artifacts/nuget/DreamBig.SourceGen.Dapper.PostgreSql.${{ env.PACKAGE_VERSION }}.nupkg"
          test -f "artifacts/nuget/DreamBig.SourceGen.Dapper.Sqlite.${{ env.PACKAGE_VERSION }}.nupkg"

      - name: Login to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish Package
        run: |
          dotnet nuget push "artifacts/nuget/DreamBig.SourceGen.Dapper.SqlServer.${{ env.PACKAGE_VERSION }}.nupkg" --api-key ${{ steps.login.outputs.nuget-api-key }} --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          dotnet nuget push "artifacts/nuget/DreamBig.SourceGen.Dapper.PostgreSql.${{ env.PACKAGE_VERSION }}.nupkg" --api-key ${{ steps.login.outputs.nuget-api-key }} --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          dotnet nuget push "artifacts/nuget/DreamBig.SourceGen.Dapper.Sqlite.${{ env.PACKAGE_VERSION }}.nupkg" --api-key ${{ steps.login.outputs.nuget-api-key }} --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
