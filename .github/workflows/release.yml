name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DreamBig.SourceGen.Dapper.sln

      - name: Build
        run: dotnet build DreamBig.SourceGen.Dapper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DreamBig.SourceGen.Dapper.sln --configuration Release --no-build

      - name: Pack
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "Invalid release tag format: $TAG"
            echo "Expected format: vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix"
            exit 1
          fi
          VERSION="${TAG#v}"
          dotnet pack src/DreamBig.SourceGen.Dapper.Package/DreamBig.SourceGen.Dapper.Package.csproj --configuration Release --no-build -p:Version="$VERSION" -p:PackageVersion="$VERSION"

      - name: Publish to NuGet
        run: dotnet nuget push artifacts/nuget/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
